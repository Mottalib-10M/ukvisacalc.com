# Daily rebuild: copy the Home Office register of licensed sponsors of the day (published every
# working day), then the fee and occupation tables (refreshed weekly by the cache rule), test and deploy.
name: rebuild
on:
  schedule:
    - cron: '30 9 * * 1-5'   # 09:30 UTC, after the morning publication of the register
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci --legacy-peer-deps
      - run: python3 scripts/build-data.py --only sponsors --refresh
      - run: python3 scripts/build-data.py
      - run: npx vitest run
      - run: npm run build
      - name: Commit the data of the day
        run: |
          git config user.name "rebuild-bot"; git config user.email "rebuild-bot@users.noreply.github.com"
          git add src/data public/data && git commit -m "Registre des sponsors du $(date -u +%F)" || echo "no change"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - uses: actions/deploy-pages@v4
